<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
<title id="title">Monthly demand seasonality index</title><desc id="desc">Seasonality rises from 78 in January to a peak of 138 in July.</desc>
<rect width="760" height="390" fill="#ffffff"/><text x="32" y="35" font-family="Arial" font-size="22" font-weight="bold" fill="#17365d">Monthly demand seasonality index</text>
<polyline fill="none" stroke="#17365d" stroke-width="5" points="65,278 120,270 175,246 230,214 285,150 340,102 395,78 450,110 505,174 560,230 615,262 670,254"/>
<g fill="#c55a11"><circle cx="65" cy="278" r="6"/><circle cx="120" cy="270" r="6"/><circle cx="175" cy="246" r="6"/><circle cx="230" cy="214" r="6"/><circle cx="285" cy="150" r="6"/><circle cx="340" cy="102" r="6"/><circle cx="395" cy="78" r="6"/><circle cx="450" cy="110" r="6"/><circle cx="505" cy="174" r="6"/><circle cx="560" cy="230" r="6"/><circle cx="615" cy="262" r="6"/><circle cx="670" cy="254" r="6"/></g>
<g font-family="Arial" font-size="13" fill="#17365d" text-anchor="middle"><text x="65" y="315">Jan</text><text x="120" y="315">Feb</text><text x="175" y="315">Mar</text><text x="230" y="315">Apr</text><text x="285" y="315">May</text><text x="340" y="315">Jun</text><text x="395" y="315">Jul</text><text x="450" y="315">Aug</text><text x="505" y="315">Sep</text><text x="560" y="315">Oct</text><text x="615" y="315">Nov</text><text x="670" y="315">Dec</text></g><text x="32" y="360" font-family="Arial" font-size="13" fill="#555">Peak: July 138; May: 118</text></svg>
